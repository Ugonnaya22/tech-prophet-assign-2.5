<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ugonnaya's Profile</title>
  </head>
  <body>
    <!-- Genuinely decorative image -->
    <img src="media/landscape.jpg" alt="" width="800" height="200" />

    <main>
      <h1>Ugonnaya's Developer Profile</h1>

      <!-- Profile image with meaningful alternative text -->
      <img
        src="media/profile.jpeg"
        alt="A 3D animated character resembling Sasuke Uchiha wearing a padded vest"
        width="250"
        height="250"
      />

      <p>
        Welcome to my profile. I am a web development student currently
        mastering semantic HTML and accessible media.
      </p>

      <h2>My Setup</h2>
      <!-- Figure with related figcaption -->
      <figure>
        <img
          src="media/coding.avif"
          alt="A close-up of a laptop keyboard in front of a screen displaying HTML and JavaScript code"
          width="500"
          height="300"
        />
        <figcaption>
          My current coding workspace, focused on HTML and JavaScript
          development.
        </figcaption>
      </figure>

      <h2>Audio Introduction</h2>
      <!-- Audio element with controls and fallback text -->
      <audio controls>
        <source src="media/greeting.mp3" type="audio/mpeg" />
        Your browser does not support the audio element. You can
        <a href="media/greeting.mp3">download the audio</a> instead.
      </audio>

      <h2>Project Demo</h2>
      <!-- Video element with controls and fallback text -->
      <video controls width="500" height="280">
        <source src="media/demo.mp4" type="video/mp4" />
        Your browser does not support the video element.
        <a href="media/demo.mp4">Download the video</a> to watch it locally.
      </video>
    </main>
  </body>
</html>
